<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cardo', serif;
        }

        .page-wrapper {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: center;
        }

        .certificate-container {
            width: 824px;
            height: 583px;
            position: relative;
        }

        .frame {
            position: absolute;
            width: 824px;
            height: 583px;
            top: 0;
            left: 0;
        }

        .logo {
            position: absolute;
            width: 199px;
            height: 88px;
            top: 30px;
            left: 313px;
            object-fit: contain;
        }

        .certificate-of {
            position: absolute;
            top: 130px;
            left: 0;
            right: 0;
            font-family: 'Cardo', serif;
            font-weight: 700;
            color: #2c6ab1;
            font-size: 45px;
            text-align: center;
            line-height: 34.5px;
        }

        .certify-text {
            position: absolute;
            top: 234px;
            left: 0;
            right: 0;
            margin: 0;
            font-family: 'Cardo', serif;
            font-weight: 700;
            color: #183041;
            font-size: 16.8px;
            text-align: center;
            line-height: 26.6px;
        }

        .student-name {
            position: absolute;
            top: 310px;
            left: 0;
            right: 0;
            font-family: 'Cardo', serif;
            font-weight: 700;
            color: #183041;
            font-size: 61.7px;
            text-align: center;
            line-height: 97.8px;
            white-space: nowrap;
        }

        .school-info {
            position: absolute;
            top: 408px;
            left: 0;
            right: 0;
            font-family: 'Cardo', serif;
            font-weight: 400;
            font-style: italic;
            color: #000000;
            font-size: 15.3px;
            text-align: center;
            line-height: 21.3px;
            white-space: nowrap;
        }

        .rank-info {
            position: absolute;
            top: 436px;
            left: 0;
            right: 0;
            margin: 0;
            font-family: 'Cardo', serif;
            font-weight: 400;
            color: #000000;
            font-size: 15.3px;
            text-align: center;
            line-height: 21.3px;
            white-space: nowrap;
        }

        .exam-date {
            position: absolute;
            top: 462px;
            left: 0;
            right: 0;
            margin: 0;
            font-family: 'Cardo', serif;
            font-weight: 400;
            color: #000000;
            font-size: 15.3px;
            text-align: center;
            line-height: 21.3px;
            white-space: nowrap;
        }

        .signature-left {
            position: absolute;
            width: 61px;
            height: 34px;
            top: 440px;
            left: 110px;
            object-fit: contain;
        }

        .signature-right {
            position: absolute;
            width: 95px;
            height: 36px;
            top: 440px;
            left: 663px;
            object-fit: contain;
        }

        .sig-name-left {
            position: absolute;
            top: 485px;
            left: 104px;
            font-family: 'Cardo', serif;
            font-weight: 700;
            color: #000000;
            font-size: 13.8px;
            line-height: 18.8px;
            white-space: nowrap;
        }

        .sig-title-left {
            position: absolute;
            top: 505px;
            left: 76px;
            font-family: 'Cardo', serif;
            font-weight: 400;
            color: #000000;
            font-size: 13.8px;
            line-height: 18.8px;
            white-space: nowrap;
        }

        .sig-name-right {
            position: absolute;
            top: 484px;
            left: 670px;
            font-family: 'Cardo', serif;
            font-weight: 700;
            color: #000000;
            font-size: 13.8px;
            line-height: 18.8px;
            white-space: nowrap;
        }

        .sig-title-right {
            position: absolute;
            top: 505px;
            left: 651px;
            font-family: 'Cardo', serif;
            font-weight: 400;
            color: #000000;
            font-size: 13.8px;
            line-height: 18.8px;
            white-space: nowrap;
        }

        .badge {
            position: absolute;
            width: 155px;
            height: 51px;
            top: 525px;
            left: 335px;
        }

        .badge-text {
            position: absolute;
            top: 541px;
            left: 362px;
            font-family: 'Cardo', serif;
            font-weight: 700;
            color: #ffffff;
            font-size: 12px;
            line-height: 19px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="certificate-container">
            <img class="frame" src="{{borderImage}}" alt=""/>
            <img class="logo" src="{{logoImage}}" alt="NFO Logo"/>

            <div class="certificate-of">Certificate of<br>Participation</div>

            <p class="certify-text">This is to certify that</p>

            <div class="student-name">{{name}}</div>

            <div class="school-info">of grade {{class}} from {{school}}</div>

            <p class="rank-info">achieved {{rank}} in the National Level of the</p>

            <p class="exam-date">National Finance Olympiad held on {{date}}</p>

            <img class="signature-left" src="{{cashfreeSignature}}" alt="Cashfree Signature"/>
            <div class="sig-name-left">Reeju Datta</div>
            <div class="sig-title-left">Co-founder, Cashfree</div>

            <img class="signature-right" src="{{streakSignature}}" alt="Streak Signature"/>
            <div class="sig-name-right">Shiv Bidani</div>
            <div class="sig-title-right">Co-founder, Streak</div>
        </div>
    </div>
</body>
</html>
